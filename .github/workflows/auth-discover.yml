name: auth-discover
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://raw.githubusercontent.com/AuthMe/AuthMeReloaded/6.0.1
          echo "=== premium.md"; curl -s $B/docs/premium.md
          echo "=== config grep"; curl -s $B/docs/config.md | grep -n -i -A3 "premium\|floodgate\|bedrock\|dialog\|unrestricted\|forceSingleSession\|allowedNicknameCharacters\|enforce" | head -150
          echo "=== floodgate in src"; curl -s -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/search/code?q=floodgate+repo:AuthMe/AuthMeReloaded" | jq -r '.items[]?.path' | head
