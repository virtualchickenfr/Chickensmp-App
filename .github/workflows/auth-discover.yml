name: auth-discover
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: |
          R=https://repo.codemc.io/repository/maven-releases/com/github/retrooper
          for a in packetevents-api packetevents-spigot packetevents-netty-common; do curl -sfo $a.jar $R/$a/2.14.0/$a-2.14.0.jar && echo "got $a" || echo "miss $a"; done
          curl -s $R/packetevents-spigot/2.14.0/packetevents-spigot-2.14.0.pom | head -60
          for c in com.github.retrooper.packetevents.wrapper.login.server.WrapperLoginServerEncryptionRequest com.github.retrooper.packetevents.wrapper.login.client.WrapperLoginClientEncryptionResponse com.github.retrooper.packetevents.wrapper.login.client.WrapperLoginClientLoginStart com.github.retrooper.packetevents.protocol.player.User com.github.retrooper.packetevents.netty.channel.ChannelHelper com.github.retrooper.packetevents.event.PacketReceiveEvent com.github.retrooper.packetevents.event.ProtocolPacketEvent com.github.retrooper.packetevents.event.PacketListenerAbstract; do echo "=== $c"; javap -cp packetevents-api.jar:packetevents-netty-common.jar:packetevents-spigot.jar -public $c 2>&1 | head -80; done
          unzip -l packetevents-spigot.jar | grep -i "plugin.yml\|paper-plugin"; unzip -p packetevents-spigot.jar plugin.yml 2>/dev/null | head
