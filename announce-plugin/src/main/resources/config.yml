      - "<gray>Kein Cheaten, kein Griefen, sei nett zu allen. Alle Regeln: <click:open_url:'{website}'><hover:show_text:'<gray>Regeln lesen'><aqua><u>store.chickensmp.net</u></aqua></hover></click>"
