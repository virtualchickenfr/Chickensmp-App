# ============================================================
#  ChickenSMPAdmin
#  /admin = admin menu: ranks, shard tools, spawners, money, shards, key all
#  /admin give <player> tool <pickaxe|shovel|axe|rocket|bucket> [amount]
#  /admin give <player> spawner <mob> [amount]      (for shops / crates)
#  /admin reload
#  Every admin action is written to plugins/ChickenSMPAdmin/log.txt
# ============================================================

messages:
  prefix: "&#FC0000&lADMIN &r&7» &f"

# ------------------------------------------------------------ ranks
# group = LuckPerms group, name = what the menu shows. Staff ranks need chickensmp.admin.ranks.staff.
ranks:
  # colors: one hex colour, or "start:end" for a gradient; symbol = icon behind the name
  store:
    hero:     { name: "Plus",     colors: "7FE7FF:3B9BFF", symbol: "✧", item: DIAMOND }
    elite:    { name: "Elite",    colors: "7CFFB2:00C46A", symbol: "✦", item: EMERALD }
    titan:    { name: "Supreme",  colors: "FFC48A:FF4B2B", symbol: "❖", item: NETHERITE_INGOT }
    prestige: { name: "Prestige", colors: "E2B0FF:8A3BFF", symbol: "⚜", item: NETHER_STAR }
  staff:
    jr.helper: { name: "Jr. Helper", colors: "00FC00", symbol: "✚", item: WOODEN_SWORD }
    helper:    { name: "Helper",     colors: "00FC00", symbol: "✚", item: STONE_SWORD }
    mod:       { name: "Mod",        colors: "00A4FC", symbol: "⚔", item: IRON_SWORD }
    sr.mod:    { name: "Sr. Mod",    colors: "00A4FC", symbol: "⚔", item: DIAMOND_SWORD }
    admin:     { name: "Admin",      colors: "FC0000", symbol: "⚡", item: NETHERITE_SWORD }
    manager:   { name: "Manager",    colors: "A303F9", symbol: "✪", item: MACE }
  other:
    booster:      { name: "Booster",      colors: "FC00E3", symbol: "❤", item: PINK_DYE }
    media:        { name: "Media",        colors: "FC00E3", symbol: "▶", item: PAINTING }
    servermedia:  { name: "Server Media", colors: "FF6ED8:8A5CFF", symbol: "✦", item: ITEM_FRAME }
    socialmedia:  { name: "Social Media", colors: "FC00E3", symbol: "✎", item: WRITABLE_BOOK }

# Buttons in the duration menu (a "custom" button is always added). LuckPerms format: 1h, 1d, 2w, 1mo
rank-durations: [permanent, 1h, 1d, 7d, 30d, 90d]

# ------------------------------------------------------------ money / shards
amounts:
  money: [1k, 10k, 100k, 1m, 10m, 100m]
  shards: [10, 50, 100, 500, 1k, 5k]
# Giving at least this much asks for a confirmation first (taking always asks).
confirm-above:
  money: 10000000
  shards: 1000

# ------------------------------------------------------------ shard tools
tools:
  # tools do nothing special in these worlds
  disabled-worlds: []
  # the 3x3 tools skip blocks at least this hard (obsidian = 50, ancient debris = 30)
  max-hardness: 30
  pickaxe:
    material: NETHERITE_PICKAXE
    name: "&#00A4FC&l3X3 PICKAXE"
    lore: ["&7Shard Tool", "", "&#00A4FCInformation", "&fMines a &#FCE3003x3 &farea.", "&fSneak to mine one block."]
    enchantments: [efficiency:5, fortune:3, unbreaking:3]
    unbreakable: true
  shovel:
    material: NETHERITE_SHOVEL
    name: "&#00A4FC&l3X3 SHOVEL"
    lore: ["&7Shard Tool", "", "&#00A4FCInformation", "&fDigs a &#FCE3003x3 &farea.", "&fSneak to dig one block."]
    enchantments: [efficiency:5, unbreaking:3]
    unbreakable: true
  axe:
    material: NETHERITE_AXE
    name: "&#00A4FC&lTREE AXE"
    lore: ["&7Shard Tool", "", "&#00A4FCInformation", "&fFells a &#FCE300whole tree&f.", "&fSneak to chop one log."]
    enchantments: [efficiency:5, unbreaking:3]
    unbreakable: true
    max-logs: 256
    blocks-per-tick: 4
    # only trees with natural leaves (keeps log houses safe)
    require-leaves: true
  rocket:
    material: FIREWORK_ROCKET
    name: "&#00A4FC&lINFINITE ROCKET"
    lore: ["&7Shard Tool", "", "&#00A4FCInformation", "&fBoost your elytra &#FCE300forever&f.", "&fIs never used up."]
    enchantments: []
    flight-duration: 3
  bucket:
    material: BUCKET
    name: "&#00A4FC&lSPONGE BUCKET"
    lore: ["&7Shard Tool", "", "&#00A4FCInformation", "&fRemoves water and lava", "&fnearby like a &#FCE300sponge&f."]
    enchantments: []
    radius: 6
    max-blocks: 128
    absorb-lava: true

# ------------------------------------------------------------ spawners (mob types + drops in mobs.yml)
spawners:
  prefix: "&#00A4FC&lSPAWNER &r&7» &f"
  # seconds between drop cycles while a player is within activation-range
  delay-min-seconds: 60
  delay-max-seconds: 120
  activation-range: 48
  # each spawner in the stack "kills" this many mobs per cycle
  mobs-per-cycle-min: 1
  mobs-per-cycle-max: 3
  max-stack: 10000
  # items / XP each spawner in the stack can hold
  storage-per-spawner: 576
  xp-per-spawner: 1000
  silk-touch-only: true
  # silk touch on a natural (dungeon) spawner gives a spawner item of that mob
  natural-silk-drop: true
  disabled-worlds: []
  # sell prices = EconomyCore worth.yml (same as /sell); sell-prices only for items it doesn't have
  use-economycore-worth: true
  sell-default-price: 0
  sell-prices: {}
