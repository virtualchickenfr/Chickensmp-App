name: sign-plugin
on:
  push:
    branches: [main]
    paths: ['sign-plugin/**', '.github/workflows/sign-plugin.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build
        run: cd sign-plugin && mvn -q -B package && ls -la target/*.jar
      - name: Prepare test server
        run: |
          mkdir -p srv/plugins && cd srv
          B=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds/latest)
          curl -sfo paper.jar "$(echo "$B" | jq -r '.downloads["server:default"].url')"
          H="Authorization: Bearer ${{ github.token }}"
          for r in ViaVersion/ViaVersion ViaVersion/ViaBackwards; do
            u=$(curl -s -H "$H" https://api.github.com/repos/$r/releases/latest | jq -r '[.assets[]|select(.name|endswith(".jar"))][0].browser_download_url')
            curl -sfLo plugins/$(basename $r).jar "$u"
          done
          curl -sfLo plugins/LuckPerms.jar "$(curl -s 'https://api.modrinth.com/v2/project/luckperms/version?loaders=%5B%22bukkit%22%5D' | jq -r '.[0].files[0].url')"
          cp ../sign-plugin/target/ChickenSMPSign.jar plugins/
          echo "eula=true" > eula.txt
          printf "settings:\n  connection-throttle: -1\n" > bukkit.yml
          printf "online-mode=false\nenforce-secure-profile=false\nserver-port=25565\nspawn-protection=0\nlevel-type=minecraft\\\\:flat\n" > server.properties
      - name: Start server
        run: |
          cd srv && touch server.in
          (tail -f server.in | java -Xmx2G -jar paper.jar --nogui > server.log 2>&1 &)
          for i in $(seq 1 150); do grep -q 'Done (' server.log && break; sleep 2; done
          grep -q "ChickenSMPSign enabled" server.log
      - name: Bot test
        run: |
          cd srv && npm init -y >/dev/null && npm i -s mineflayer >/dev/null 2>&1
          cp ../sign-plugin/test/test.js .
          BOT_HOST=$(hostname -I | awk '{print $1}') timeout 240 node test.js
      - name: Server log
        if: always()
        run: |
          cd srv && echo "stop" >> server.in; sleep 8
          grep -vE "^\s*at " server.log | grep -iE "sign|exception|error" | head -60
          ! grep -q "Exception" server.log
      - name: Publish jar
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          cp sign-plugin/target/ChickenSMPSign.jar /tmp/
          git fetch -q origin plugin-dist && git checkout -q plugin-dist
          cp /tmp/ChickenSMPSign.jar . && git add ChickenSMPSign.jar && git commit -qm "ChickenSMPSign build" && git push -q origin plugin-dist || echo unchanged
