name: admin-plugin
on:
  push:
    branches: [main]
    paths: ['admin-plugin/**', '.github/workflows/admin-plugin.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build
        run: cd admin-plugin && mvn -q -B package && ls -la target/*.jar
      - name: Prepare test server
        run: |
          mkdir -p srv/plugins && cd srv
          B=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds/latest)
          curl -sfo paper.jar "$(echo "$B" | jq -r '.downloads["server:default"].url')"
          cp ../admin-plugin/target/ChickenSMPAdmin.jar plugins/
          mkdir -p plugins/ChickenSMPAdmin && sed -e 's/delay-min-seconds: 60/delay-min-seconds: 1/' -e 's/delay-max-seconds: 120/delay-max-seconds: 2/' ../admin-plugin/src/main/resources/config.yml > plugins/ChickenSMPAdmin/config.yml
          echo "eula=true" > eula.txt
          printf "settings:\n  connection-throttle: -1\n" > bukkit.yml
          printf "online-mode=false\nenforce-secure-profile=false\nserver-port=25565\nspawn-protection=0\nlevel-type=minecraft\\\\:flat\n" > server.properties
      - name: Start server
        run: |
          cd srv && touch server.in
          (tail -f server.in | java -Xmx2G -jar paper.jar --nogui > server.log 2>&1 &)
          for i in $(seq 1 150); do grep -q 'Done (' server.log && break; sleep 2; done
          grep -q "ChickenSMPAdmin enabled" server.log
      - name: Bot test
        run: |
          cd srv && npm init -y >/dev/null && npm i -s mineflayer vec3 >/dev/null 2>&1
          cp ../admin-plugin/test/test.js .
          BOT_HOST=$(hostname -I | awk '{print $1}') BOT_PORT=25565 timeout 240 node test.js
      - name: Server log
        if: always()
        run: |
          cd srv && echo "stop" >> server.in; sleep 8
          grep -vE "^\s*at " server.log | grep -iE "admin|exception|error" | head -60
          ! grep -v packetevents server.log | grep -q "Exception"
          ! grep -q "Failed to register" server.log
      - name: Publish jar
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          cp admin-plugin/target/ChickenSMPAdmin.jar /tmp/
          git fetch -q origin plugin-dist && git checkout -f -q -B plugin-dist origin/plugin-dist
          cp /tmp/ChickenSMPAdmin.jar . && git add ChickenSMPAdmin.jar && git commit -qm "ChickenSMPAdmin build" && git push -q origin plugin-dist || echo unchanged
