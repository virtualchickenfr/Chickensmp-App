name: Web app (iPhone)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web app
        run: bash scripts/build-web.sh
      - name: Publish to web branch (served at store.chickensmp.net)
        working-directory: build/dist
        run: |
          git init -q -b web
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Web app ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" web
