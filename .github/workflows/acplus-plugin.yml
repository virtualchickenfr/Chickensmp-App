name: acplus-plugin
on:
  push:
    branches: [main]
    paths: ['acplus-plugin/**', '.github/workflows/acplus-plugin.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build
        run: cd acplus-plugin && mvn -q -B package && ls -la target/*.jar
      - name: Prepare test server
        run: |
          mkdir -p srv/plugins && cd srv
          B=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds/latest)
          curl -sfo paper.jar "$(echo "$B" | jq -r '.downloads["server:default"].url')"
          H="Authorization: Bearer ${{ github.token }}"
          for r in ViaVersion/ViaVersion ViaVersion/ViaBackwards; do
            u=$(curl -s -H "$H" https://api.github.com/repos/$r/releases/latest | jq -r '[.assets[]|select(.name|endswith(".jar"))][0].browser_download_url')
            curl -sfLo plugins/$(basename $r).jar "$u"
          done
          cp ../acplus-plugin/target/ChickenSMPAC-plus.jar plugins/
          echo "eula=true" > eula.txt
          printf "settings:\n  connection-throttle: -1\n" > bukkit.yml
          printf "online-mode=false\nenforce-secure-profile=false\nserver-port=25565\nspawn-protection=0\nlevel-type=minecraft\\\\:flat\n" > server.properties
      - name: Start server + /sus checks
        run: |
          cd srv && touch server.in
          (tail -f server.in | java -Xmx2G -jar paper.jar --nogui > server.log 2>&1 &)
          for i in $(seq 1 150); do grep -q 'Done (' server.log && break; sleep 2; done
          sed -i 's/^  cage-seconds: .*/  cage-seconds: 6/; s/^  world: "Spawn1"/  world: "world"\n  block-lifetime-seconds: 8/; s/^  safe-min: .*/  safe-min: [-15, -64, -15]/; s/^  safe-max: .*/  safe-max: [15, 319, 15]/' plugins/ChickenSMPAC-plus/config.yml
          grep -A6 "^arena:" plugins/ChickenSMPAC-plus/config.yml
          for i in $(seq 1 13); do echo "sus test Steve KillAura combat" >> server.in; done
          echo "sus" >> server.in; echo "sus Steve" >> server.in; echo "sus reload" >> server.in; sleep 4
          grep -q "ChickenSMPAC-plus enabled" server.log
          grep -q "Steve looks suspicious" server.log
          grep -q "KillAura (A) x13" server.log
          grep -q "Config reloaded" server.log
          echo "ban Steve test" >> server.in; sleep 3; echo "sus" >> server.in; sleep 2
          grep -q "Removed Steve from /sus (banned)" server.log
          grep -q "Nobody has been flagged yet" server.log
      - name: Bots (Banhammer + staff mode)
        run: |
          cd srv && npm init -y >/dev/null && npm i -s mineflayer >/dev/null 2>&1
          cp ../acplus-plugin/test/test.js .
          BOT_HOST=$(hostname -I | awk '{print $1}') timeout 240 node test.js
      - name: Server log
        if: always()
        run: |
          cd srv && echo "stop" >> server.in; sleep 8
          grep -vE "^\s*at " server.log | grep -iE "acplus|ChickenSMPAC|caged|cage|banhammer|staff|cheater|exception|error|sus" | head -80
          ! grep -q "Exception" server.log
      - name: Publish jar
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          cp acplus-plugin/target/ChickenSMPAC-plus.jar /tmp/
          git fetch -q origin plugin-dist && git checkout -q plugin-dist
          cp /tmp/ChickenSMPAC-plus.jar . && git add ChickenSMPAC-plus.jar && git commit -qm "ChickenSMPAC-plus build" && git push -q origin plugin-dist || echo unchanged
