name: Web app (iPhone)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web app
        run: |
          npx --yes create-expo-app@latest build --template blank --yes
          cp -r App.js app.json src assets build/
          cd build
          npx expo install expo-clipboard expo-status-bar expo-font @expo/vector-icons @expo-google-fonts/poppins @react-native-async-storage/async-storage react-native-safe-area-context react-dom react-native-web @expo/metro-runtime
          npx expo export --platform web --output-dir dist
      - name: Make it installable (PWA / iPhone home screen)
        working-directory: build/dist
        run: |
          B=/Chickensmp-App
          cp ../assets/apple-touch-icon.png ../assets/icon-192.png ../assets/icon-512.png .
          cat > manifest.json <<JSON
          {"name":"ChickenSMP","short_name":"ChickenSMP","start_url":"$B/","scope":"$B/","display":"standalone","orientation":"portrait","background_color":"#141414","theme_color":"#141414",
           "icons":[{"src":"$B/icon-192.png","sizes":"192x192","type":"image/png"},{"src":"$B/icon-512.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}
          JSON
          HEAD="<link rel=\"manifest\" href=\"$B/manifest.json\"><link rel=\"apple-touch-icon\" href=\"$B/apple-touch-icon.png\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\"><meta name=\"apple-mobile-web-app-title\" content=\"ChickenSMP\"><meta name=\"theme-color\" content=\"#141414\"><style>html,body{background:#141414}</style>"
          sed -i 's#<meta name="viewport"[^>]*>#<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">#' index.html
          sed -i "s#</head>#$HEAD</head>#" index.html
          touch .nojekyll
          cp index.html 404.html
      - name: Publish to gh-pages
        working-directory: build/dist
        run: |
          git init -q -b gh-pages
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Web app ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
