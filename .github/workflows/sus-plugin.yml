name: sus-plugin
on:
  push:
    branches: [main]
    paths: ['sus-plugin/**', '.github/workflows/sus-plugin.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Build
        run: cd sus-plugin && mvn -q -B package && ls -la target/*.jar
      - name: Test on Paper 1.21.11
        run: |
          mkdir -p srv/plugins && cd srv
          B=$(curl -s https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds/latest)
          curl -sfo paper.jar "$(echo "$B" | jq -r '.downloads["server:default"].url')"
          cp ../sus-plugin/target/ChickenSMPSus.jar plugins/
          echo "eula=true" > eula.txt; printf "online-mode=false\n" > server.properties
          touch in; (tail -f in | java -Xmx1G -jar paper.jar --nogui > log 2>&1 &)
          for i in $(seq 1 120); do grep -q 'Done (' log && break; sleep 2; done
          for i in $(seq 1 9); do echo "sus test Steve KillAura combat" >> in; done
          echo "sus test Alex Speed movement" >> in
          sleep 3
          echo "sus" >> in; echo "sus Steve" >> in; echo "sus reload" >> in; sleep 3
          echo "stop" >> in; sleep 12
          echo "----- log -----"; grep -vE "^\s*at " log | grep -iE "sus|steve|alex|exception|error" | head -60
          ! grep -q "Exception" log
          grep -q "ChickenSMPSus enabled" log
          grep -q "Steve looks suspicious" log
          grep -q "Most flagged players" log
          grep -q "KillAura (A) x9" log
          grep -q "Config reloaded" log
          grep -q "Steve:" plugins/ChickenSMPSus/data.yml || grep -q "name: Steve" plugins/ChickenSMPSus/data.yml
      - name: Publish jar
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          cp sus-plugin/target/ChickenSMPSus.jar /tmp/
          git fetch -q origin plugin-dist && git checkout -q plugin-dist
          cp /tmp/ChickenSMPSus.jar . && git add ChickenSMPSus.jar && git commit -qm "ChickenSMPSus build" && git push -q origin plugin-dist || echo unchanged
