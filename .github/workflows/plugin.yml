name: Build server plugin

on:
  push:
    branches: [main]
    paths: ['plugin/**', '.github/workflows/plugin.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build
        working-directory: plugin
        run: mvn -B -q package
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-${{ github.run_number }}
          name: Server-Plugin ${{ github.run_number }}
          make_latest: false
          files: plugin/target/ChickenSMPApp.jar
          body: |
            ChickenSMPApp.jar in den plugins-Ordner des Servers legen und neu starten.
            Spieler tippen /app, um sich in der App anzumelden.
