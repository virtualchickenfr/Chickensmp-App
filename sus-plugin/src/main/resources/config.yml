# ------------------------------------------------------------
#  ChickenSMPSus - suspicious player tracker for Vulcan
# ------------------------------------------------------------
# Every Vulcan flag adds points to a player's "sus score".
# Points older than "window-minutes" drop off again.

# Time window for the sus score, in minutes.
window-minutes: 30

# Points per flag, by Vulcan check category. Anything not listed uses "default".
weights:
  combat: 2.0
  movement: 1.0
  player: 1.0
  default: 1.0

# Experimental checks only count this much (0.5 = half).
experimental-multiplier: 0.5

# Checks to ignore completely (Vulcan check names, case-insensitive), e.g. ["BadPackets", "Timer"].
ignored-checks: []

# Score needed to show up as SUSPICIOUS (red) and to alert staff.
sus-score: 15
# Score shown as "watch" (yellow) in /sus.
watch-score: 6

# Minimum minutes between two staff alerts for the same player.
alert-cooldown-minutes: 5

# How many players /sus shows.
list-size: 10

# Sound for staff when a player becomes suspicious ("" = none).
alert-sound: "BLOCK_NOTE_BLOCK_PLING"

# Discord webhook for suspicious player alerts ("" = off).
discord-webhook-url: ""
discord-username: "ChickenSMP Sus"

# Messages (MiniMessage format). Placeholders are shown in {braces}.
messages:
  prefix: "<gradient:#3b7bff:#7cc4ff><bold>SUS</bold></gradient> <dark_gray>»</dark_gray> "
  alert: "<red><bold>{player}</bold></red> <gray>looks suspicious:</gray> <white>{score}</white> <gray>points in {window}m</gray> <dark_gray>(</dark_gray><gray>{top}</gray><dark_gray>)</dark_gray> <click:run_command:'/sus {player}'><aqua>[Info]</aqua></click> <click:run_command:'/sus tp {player}'><green>[TP]</green></click>"
  list-header: "<gray>Most flagged players (last {window}m):</gray>"
  list-line: "<dark_gray>{rank}.</dark_gray> <click:run_command:'/sus {player}'><hover:show_text:'<gray>Click for details'>{color}{player}</hover></click> <dark_gray>-</dark_gray> <white>{score}</white> <gray>pts</gray> <dark_gray>|</dark_gray> <gray>{top}</gray>{online}"
  list-empty: "<green>Nobody has been flagged in the last {window} minutes.</green>"
  online-tag: " <green>●</green>"
  no-data: "<gray>No flags recorded for <white>{player}</white>.</gray>"
  cleared: "<green>Cleared all sus data of <white>{player}</white>.</green>"
  reloaded: "<green>Config reloaded.</green>"
  not-online: "<red>{player} is not online.</red>"
  teleported: "<green>Teleported to <white>{player}</white>.</green>"
  vulcan-missing: "<yellow>Vulcan is not installed or not loaded - no flags are being recorded.</yellow>"
  usage: "<gray>/sus</gray> <dark_gray>-</dark_gray> list <dark_gray>|</dark_gray> <gray>/sus <player></gray> <dark_gray>|</dark_gray> <gray>/sus tp <player></gray> <dark_gray>|</dark_gray> <gray>/sus clear <player></gray> <dark_gray>|</dark_gray> <gray>/sus reload</gray>"
