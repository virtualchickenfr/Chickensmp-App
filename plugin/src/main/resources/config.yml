# ChickenSMP app connection
api-url: "https://store.chickensmp.net/api/mc"
# Created automatically on first start. Do not share it.
secret: ""
# How often stats of online players are sent (minutes)
sync-minutes: 5
# Command used to give daily-login rewards from the app ({player}, {key}, {amount})
reward-command: "keymanager add {player} {key} {amount}"
