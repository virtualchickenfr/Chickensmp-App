# ChickenSMPSign
# How often a player can use /sign per day. The day resets at midnight in "timezone".
# Ranks get more uses with the permission chickensmp.sign.limit.<number> (the highest one wins).
# chickensmp.sign.unlimited (ops by default) = no limit.
default-limit: 1
timezone: Europe/Berlin
max-message-length: 40
# How many players can sign the same item (each player once).
# chickensmp.sign.bypass (ops / admins) can go over this.
max-signatures-per-item: 2
date-format: "dd.MM.yyyy"
# Show the signer's rank prefix in front of the name.
show-rank: true
debug: false

# Lines added to the item. <rank>, <player>, <message>, <date> are replaced.
# <rank> = the LuckPerms prefix of the signer's top group (same colours as in chat), or nothing.
# A line with <message> is skipped when the player gives no message.
# <frame>...</frame> is drawn in the colour of the signer's rank (see frame-colors).
lore:
  - ""
  - "<frame>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</frame>"
  - "<frame>┃</frame> <gray>✎ Signed by <rank><frame><player></frame>"
  - "<frame>┃</frame> <gray>\"<white><message></white>\""
  - "<frame>┃</frame> <dark_gray><date>"
  - "<frame>▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬</frame>"

# Frame colour per rank = the signer's LuckPerms group with the highest weight.
# One colour = plain colour, several (separated by ":") = gradient. Unknown groups use "default".
frame-colors:
  - {group: owner, colors: "#55ffff"}
  - {group: manager, colors: "#aa0000"}
  - {group: dev, colors: "#5555ff"}
  - {group: admin, colors: "#ff5555"}
  - {group: sr.mod, colors: "#5555ff"}
  - {group: mod, colors: "#5555ff"}
  - {group: helper, colors: "#55ff55"}
  - {group: jr.helper, colors: "#55ff55"}
  - {group: servermedia, colors: "#ff6ed8:#8a5cff"}
  - {group: media, colors: "#ff55ff"}
  - {group: booster, colors: "#ff55ff"}
  - {group: supreme, colors: "#ffffff:#ffc31c:#ff9900"}
  - {group: core, colors: "#ffffff:#8c8c8c"}
  - {group: "+", colors: "#ffffff:#99daed"}
  - {group: default, colors: "#aaaaaa"}

prefix: "<gradient:#3b7bff:#7cc4ff><b>SIGN</b></gradient> <dark_gray>» "
messages:
  signed: "<gray>Item signed! <dark_gray>(<white><left></white> left today)"
  signed-unlimited: "<gray>Item signed!"
  no-item: "<red>Hold the item you want to sign in your main hand."
  already-signed: "<red>You already signed this item."
  max-signatures: "<red>This item already has <white><max></white> signatures."
  limit-reached: "<red>You used all your signs for today (<white><limit></white>). <gray>More signs with a rank: <white>/rank"
  too-long: "<red>Your message is too long (max <white><max></white> characters)."
  not-signed: "<red>This item is not signed."
  not-yours: "<red>You have not signed this item."
  unsigned: "<gray>Signature removed."
  players-only: "<red>Only players can sign items."
  reloaded: "<gray>Config reloaded."
