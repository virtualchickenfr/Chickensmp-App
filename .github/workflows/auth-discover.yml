name: auth-discover
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          H="Authorization: Bearer ${{ github.token }}"
          for t in 6.0.0 6.0.1; do echo "== AuthMe $t"; curl -s -H "$H" https://api.github.com/repos/AuthMe/AuthMeReloaded/releases/tags/$t | jq -r .body | head -60; done
          echo "== PL dev-build body"; curl -s -H "$H" https://api.github.com/repos/dmulloy2/ProtocolLib/releases/tags/dev-build | jq -r '.body, (.assets[]|.name+" "+.updated_at)' | head -20
          echo "== PL commits"; curl -s -H "$H" "https://api.github.com/repos/dmulloy2/ProtocolLib/commits?per_page=6" | jq -r '.[]|.commit.committer.date+" "+(.commit.message|split("\n")[0])'
          echo "== FL commits"; curl -s -H "$H" "https://api.github.com/repos/TuxCoding/FastLogin/commits?per_page=6" | jq -r '.[]|.commit.committer.date+" "+(.commit.message|split("\n")[0])'
          echo "== FL issues 1.21"; curl -s -H "$H" "https://api.github.com/search/issues?q=repo:TuxCoding/FastLogin+1.21&sort=created&per_page=8" | jq -r '.items[]|.created_at+" "+.state+" "+.title'
          echo "== AuthMe premium search"; curl -s -H "$H" "https://api.github.com/search/issues?q=repo:AuthMe/AuthMeReloaded+premium&sort=created&per_page=8" | jq -r '.items[]|.created_at+" "+.state+" "+.title'
