# ============================================================================
#  Reminders  (ChickenSMP)
# ============================================================================
#  Add as many reminders as you like under "reminders:". Each one:
#    interval-minutes : how often it is broadcast to chat.
#    sound            : played when it is sent. Format: key|volume|pitch.
#                       Empty = no sound.
#    lines            : the message, sent line by line to every player.
#
#  "lines" go to chat, so MiniMessage works there on top of the & codes, and
#  both may be mixed in one line:
#    <click:open_url:'https://example.com'>text</click>
#    <hover:show_text:'&7Tooltip'>text</hover>
#    <gradient:#00A4FC:#ffffff>text</gradient>   <rainbow>text</rainbow>
#  A line without any < is parsed exactly as before. Inside a line that has a
#  tag, an & colour no longer clears bold/italic; use </bold> or <reset>.
#
#  Fire one at any time with:  /reminder <name>
#  Reminders are staggered so two never send at the same moment
#  (see reminders.stagger-seconds in config.yml).
#
#  ChickenSMP: 11 reminders, each every 44 minutes, staggered by 4 minutes
#  -> one reminder every 4 minutes.
#  Discord: the old invite expired. When there is a new one, replace
#  https://store.chickensmp.net in the "discord" reminder with it.
# ============================================================================

