name: transcribe
on:
  workflow_dispatch:
    inputs:
      file: { description: 'audio/video file in the repo', required: true }
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - uses: actions/cache@v4
        with: { path: "~/.cache/explainroo\n~/.npm", key: explainroo-v1 }
      - run: |
          f="${{ inputs.file }}"; ffmpeg -v error -y -f lavfi -i color=c=black:s=320x240:r=10 -i "$f" -shortest -c:v libx264 -c:a aac /tmp/t.mp4
          npx --yes explainroo cut /tmp/t.mp4 --language en
          cat /tmp/t.cut.md
