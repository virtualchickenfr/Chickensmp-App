# ------------------------------------------------------------
#  ChickenSMPAC-plus - suspicious player tracker (GrimAC flags)
# ------------------------------------------------------------
# Every Vulcan flag adds points to a player's "sus score".
# Points never expire. An entry is deleted automatically when the player gets banned,
# or by staff with /sus clear <player> (or the [Delete] button).

# Points per flag, by check category (combat = Reach, Aim, AutoClicker ...; movement = Simulation, Timer, NoFall ...). Anything not listed uses "default".
weights:
  combat: 2.0
  movement: 1.0
  player: 1.0
  default: 1.0

# Experimental checks only count this much (0.5 = half).
experimental-multiplier: 0.5

# Checks to ignore completely (check names, case-insensitive), e.g. ["BadPackets", "Timer"].
ignored-checks: []

# Score needed to show up as SUSPICIOUS (red) and to alert staff.
sus-score: 40
# Score shown as "watch" (yellow) in /sus.
watch-score: 15

# Minimum minutes between two staff alerts for the same player.
alert-cooldown-minutes: 5

# How many players /sus shows.
list-size: 10

# Sound for staff when a player becomes suspicious ("" = none).
alert-sound: "BLOCK_NOTE_BLOCK_PLING"

# Discord webhook for suspicious player alerts ("" = off).
discord-webhook-url: ""
discord-username: "ChickenSMP Sus"

# Messages (MiniMessage format). Placeholders are shown in {braces}.
messages:
  prefix: "<gradient:#3b7bff:#7cc4ff><bold>SUS</bold></gradient> <dark_gray>»</dark_gray> "
  alert: "<red><bold>{player}</bold></red> <gray>looks suspicious:</gray> <white>{score}</white> <gray>points</gray> <dark_gray>(</dark_gray><gray>{top}</gray><dark_gray>)</dark_gray> <click:run_command:'/sus {player}'><aqua>[Info]</aqua></click> <click:run_command:'/sus tp {player}'><green>[TP]</green></click> <click:run_command:'/sus watch {player}'><aqua>[Watch]</aqua></click>"
  list-header: "<gray>Most flagged players:</gray>"
  list-line: "<dark_gray>{rank}.</dark_gray> <click:run_command:'/sus {player}'><hover:show_text:'<gray>Click for details'>{color}{player}</hover></click> <dark_gray>-</dark_gray> <white>{score}</white> <gray>pts</gray> <dark_gray>|</dark_gray> <gray>{top}</gray>{online} <click:run_command:'/sus clear {player}'><hover:show_text:'<gray>Delete entry'><dark_red>[x]</dark_red></hover></click>"
  list-empty: "<green>Nobody has been flagged yet.</green>"
  online-tag: " <green>●</green>"
  no-data: "<gray>No flags recorded for <white>{player}</white>.</gray>"
  cleared: "<green>Cleared all sus data of <white>{player}</white>.</green>"
  reloaded: "<green>Config reloaded.</green>"
  not-online: "<red>{player} is not online.</red>"
  teleported: "<green>Staff mode on, teleported to <white>{player}</white>.</green> <gray>/staff to go back.</gray>"
  watching: "<green>Staff mode on, watching <white>{player}</white>.</green> <gray>Sneak to stop, /staff to go back.</gray>"
  vulcan-missing: "<yellow>No anticheat (GrimAC) is loaded - no flags are being recorded.</yellow>"
  usage: "<gray>/sus</gray> <dark_gray>-</dark_gray> list <dark_gray>|</dark_gray> <gray>/sus <player></gray> <dark_gray>|</dark_gray> <gray>/sus tp|watch <player></gray> <dark_gray>|</dark_gray> <gray>/sus clear <player></gray> <dark_gray>|</dark_gray> <gray>/sus reload</gray>"

# ------------------------------------------------------------
#  Banhammer - /banhammer gives it. Right-click switches the mode,
#  hitting a player catches them: CAUGHT! title, cage, then the punishment.
# ------------------------------------------------------------
banhammer:
  name: "<gradient:#ff3b3b:#ff9a3b><bold>BANHAMMER</bold></gradient>"
  # Hit the same player twice within this many seconds to confirm (0 = first hit counts).
  confirm-seconds: 4
  # Seconds the caught player stays caged and frozen before the punishment runs.
  cage-seconds: 60
  # Blocks for the cage.
  cage-bars: IRON_BARS
  cage-floor: OBSIDIAN
  cage-roof: RED_STAINED_GLASS
  # Tell everyone who got caught ("" = off). {player} {staff} {mode}
  broadcast: "<dark_red><bold>CAUGHT!</bold></dark_red> <red>{player}</red> <gray>was caught by the</gray> <gradient:#ff3b3b:#ff9a3b><bold>Banhammer</bold></gradient><gray>.</gray>"
  title: "<dark_red><bold>CAUGHT!</bold></dark_red>"
  subtitle: "<red>You were caught by {staff}</red>"
  # Modes, in the order right-click cycles through them.
  # command: run as the staff member ({player} = target, "" = none). cage: play the cage animation first.
  modes:
    - name: "Ban (permanent)"
      color: "<dark_red>"
      command: "ban {player} Caught cheating by the Banhammer"
      cage: true
    - name: "Ban (30 days)"
      color: "<red>"
      command: "ban {player} 30d Caught cheating by the Banhammer"
      cage: true
    - name: "Ban (7 days)"
      color: "<gold>"
      command: "ban {player} 7d Caught cheating by the Banhammer"
      cage: true
    - name: "Cage only (1 minute)"
      color: "<yellow>"
      command: ""
      cage: true
    - name: "Kick"
      color: "<aqua>"
      command: "kick {player} Caught by the Banhammer"
      cage: false

# ------------------------------------------------------------
#  Staff mode - /staff: invisible for normal players, fly through blocks
#  (spectator mode). Inventory, game mode and position come back on /staff.
# ------------------------------------------------------------
staff-mode:
  actionbar: "<gradient:#3b7bff:#7cc4ff><bold>STAFF MODE</bold></gradient> <gray>- invisible, /staff to leave</gray>"
  enabled-message: "<green>Staff mode on.</green> <gray>Only staff can see you. You can fly through blocks.</gray>"
  disabled-message: "<red>Staff mode off.</red> <gray>Your inventory and position are back.</gray>"
  # Fake leave/join messages for normal players when toggling.
  fake-messages: true
  fake-quit: "<yellow>{player} left the game</yellow>"
  fake-join: "<yellow>{player} joined the game</yellow>"

# ------------------------------------------------------------
#  PvP area - everything in "world" outside the WorldGuard region
#  "safe-region" (the spawn) is a PvP area. Players can build there;
#  their blocks disappear again after "block-lifetime-minutes".
#  The map itself can't be broken (except by chickensmp.acplus.arena.bypass).
# ------------------------------------------------------------
arena:
  enabled: true
  world: "Spawn1"
  safe-region: "spawn"
  # Used if WorldGuard is missing: the safe zone as a box.
  safe-min: [-213, -64, 385]
  safe-max: [-134, 319, 464]
  block-lifetime-minutes: 20
  # Little particle puff when a block disappears.
  vanish-effect: true
  enter-title: "<red><bold>PVP AREA</bold></red>"
  enter-subtitle: "<gray>Blocks you place disappear after {minutes} minutes</gray>"
  leave-title: "<green><bold>SAFE ZONE</bold></green>"
  leave-subtitle: "<gray>No PvP at spawn</gray>"
  cant-break: "<red>You can only break blocks that players placed here.</red>"
